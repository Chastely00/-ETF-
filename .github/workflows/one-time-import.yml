name: One-time Historical Data Import
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-historical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run historical import script
        run: npx tsx scripts/import_historical_units.ts
      - name: Commit and push merged data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/compactRecords.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): import historical ETF unit/NAV data (2005-2026)"
            git push
          fi
