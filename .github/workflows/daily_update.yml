name: Daily ETF Data Sync

on:
  schedule:
    # 台灣時間每天 07:00 = UTC 23:00
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-etf-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run daily ETF data sync script
        run: npx tsx scripts/daily_updater.ts
        env:
          FIN_DATA_API_KEY: ${{ secrets.FIN_DATA_API_KEY }}

      - name: Commit and push if data updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/data/

          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-update ETF flow data"
            git push
          fi
