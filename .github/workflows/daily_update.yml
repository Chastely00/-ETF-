name: Daily ETF Data Sync (07:00 AM Taiwan Time)

on:
  schedule:
    # 台灣時間 (UTC+8) 每日早上 07:00 = UTC 23:00 (前一天)
    - cron: '0 23 * * *'
  workflow_dispatch: # 支援手動隨時觸發更新

jobs:
  update-etf-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily ETF data sync script
        run: npx tsx scripts/daily_updater.ts
        env:
          FIN_DATA_API_KEY: ${{ secrets.FIN_DATA_API_KEY }}

      - name: Commit and push if data updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-update ETF flow data [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          fi
