name: One-time ETF Category Reclassification
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reclassify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run category reclassification script
        run: npx tsx scripts/reclassify_categories.ts

      - name: Commit and push if data updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/etf_master.json
          if git diff --staged --quiet; then
            echo "No category changes to commit."
          else
            git commit -m "chore(data): reclassify ETF categories (fix 待分類 backlog)"
            git push
          fi
